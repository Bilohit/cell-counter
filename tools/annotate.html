<!doctype html><meta charset="utf-8"><title>Annotate cells</title>
<style>
body{margin:0;font:14px system-ui;background:#111;color:#ddd}
#bar{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#wrap{overflow:auto;height:calc(100vh - 44px)}
canvas{display:block;image-rendering:pixelated;cursor:crosshair}
b{color:#ff4a1a}i{color:#4ad2ff;font-style:normal}
</style>
<div id="bar">
  <input type="file" id="file" accept=".png,.jpg,.jpeg">
  <label>load JSON <input type="file" id="load" accept=".json"></label>
  <label>zoom <input type="range" id="zoom" min="1" max="6" step="0.5" value="2"></label>
  <span id="n">0 solid + 0 pale</span>
  <button id="save">Download JSON</button>
  <span>left-click: add <b>solid</b> &middot; shift-click: add <i>pale</i> &middot;
        right-click: remove nearest &middot; u: undo</span>
</div>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let img=null,pts=[],pale=[],hist=[],name='',z=2;
function draw(){
  if(!img)return;c.width=img.width*z;c.height=img.height*z;
  ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0,c.width,c.height);
  ctx.fillStyle='#ff4a1a';
  for(const [x,y] of pts){ctx.beginPath();ctx.arc(x*z,y*z,3,0,7);ctx.fill();}
  ctx.strokeStyle='#4ad2ff';ctx.lineWidth=2;
  for(const [x,y] of pale){ctx.beginPath();ctx.arc(x*z,y*z,4,0,7);ctx.stroke();}
  document.getElementById('n').textContent=pts.length+' solid + '+pale.length+' pale';
}
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];name=f.name.replace(/\.(png|jpe?g)$/i,'.tif');
  img=new Image();img.onload=draw;img.src=URL.createObjectURL(f);
};
document.getElementById('load').onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{const d=JSON.parse(r.result);
    pts=(d.points||[]).map(p=>[+p[0],+p[1]]);
    pale=(d.pale||[]).map(p=>[+p[0],+p[1]]);
    if(d.image)name=d.image;hist=[];draw();};
  r.readAsText(e.target.files[0]);
};
document.getElementById('zoom').oninput=e=>{z=+e.target.value;draw();};
c.onclick=e=>{const r=c.getBoundingClientRect();
  const p=[(e.clientX-r.left)/z,(e.clientY-r.top)/z];
  if(e.shiftKey){pale.push(p);hist.push('pale');}else{pts.push(p);hist.push('pts');}
  draw();};
c.oncontextmenu=e=>{e.preventDefault();
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/z,y=(e.clientY-r.top)/z;
  let best=400,arr=null,k=-1;
  [pts,pale].forEach(a=>{a.forEach((p,i)=>{
    const d=(p[0]-x)**2+(p[1]-y)**2;if(d<best){best=d;arr=a;k=i;}});});
  if(arr)arr.splice(k,1);draw();};
window.onkeydown=e=>{if(e.key==='u'&&hist.length){
  const w=hist.pop();(w==='pale'?pale:pts).pop();draw();}};
document.getElementById('save').onclick=()=>{
  const R=a=>a.map(p=>[Math.round(p[0]),Math.round(p[1])]);
  const blob=new Blob([JSON.stringify({image:name,points:R(pts),pale:R(pale)})],
                      {type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name.replace(/\.tif$/,'.json');a.click();};
</script>
