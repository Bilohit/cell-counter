<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
  <rect width="960" height="300" rx="14" fill="#ffffff"/>
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0V30H0" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 1 pictures -->
  <text x="30" y="40" font-weight="700" fill="#0f172a">1. Your pictures</text>
  <g transform="translate(40,70)">
    <rect x="24" y="0" width="120" height="90" fill="#eef2f6" stroke="#ea580c" stroke-width="3"/>
    <rect x="24" y="0" width="120" height="90" fill="url(#g)"/>
    <rect x="0" y="40" width="120" height="90" fill="#eef2f6" stroke="#2563eb" stroke-width="3"/>
    <rect x="0" y="40" width="120" height="90" fill="url(#g)"/>
  </g>
  <text x="30" y="240" fill="#475569">from the microscope,</text>
  <text x="30" y="260" fill="#475569">two per square</text>

  <line x1="205" y1="140" x2="250" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 joined -->
  <text x="265" y="40" font-weight="700" fill="#0f172a">2. Joined</text>
  <g transform="translate(270,70)">
    <rect width="120" height="120" fill="#eef2f6"/>
    <rect width="120" height="120" fill="url(#g)"/>
    <rect x="-6" y="-6" width="132" height="132" fill="none" stroke="#16a34a" stroke-width="2"/>
    <rect x="-10" y="-10" width="140" height="140" fill="none" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="265" y="240" fill="#475569">into one whole square,</text>
  <text x="265" y="260" fill="#475569">triple line found</text>

  <line x1="435" y1="140" x2="480" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 dots -->
  <text x="495" y="40" font-weight="700" fill="#0f172a">3. Cells found</text>
  <g transform="translate(500,70)">
    <rect width="120" height="120" fill="#eef2f6"/>
    <rect width="120" height="120" fill="url(#g)"/>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <circle cx="14" cy="18" r="6"/><circle cx="48" cy="12" r="6"/><circle cx="80" cy="24" r="6"/>
      <circle cx="104" cy="10" r="6"/><circle cx="22" cy="52" r="6"/><circle cx="62" cy="46" r="6"/>
      <circle cx="96" cy="58" r="6"/><circle cx="36" cy="84" r="6"/><circle cx="74" cy="90" r="6"/>
      <circle cx="108" cy="100" r="6"/><circle cx="14" cy="106" r="6"/><circle cx="54" cy="110" r="6"/>
    </g>
    <g fill="#f97316">
      <circle cx="14" cy="18" r="3"/><circle cx="48" cy="12" r="3"/><circle cx="80" cy="24" r="3"/>
      <circle cx="104" cy="10" r="3"/><circle cx="22" cy="52" r="3"/><circle cx="62" cy="46" r="3"/>
      <circle cx="96" cy="58" r="3"/><circle cx="36" cy="84" r="3"/><circle cx="74" cy="90" r="3"/>
      <circle cx="108" cy="100" r="3"/><circle cx="14" cy="106" r="3"/><circle cx="54" cy="110" r="3"/>
    </g>
  </g>
  <text x="495" y="240" fill="#475569">an orange dot on each,</text>
  <text x="495" y="260" fill="#475569">you check and fix</text>

  <line x1="665" y1="140" x2="710" y2="140" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <!-- 4 result -->
  <text x="725" y="40" font-weight="700" fill="#0f172a">4. Concentration</text>
  <rect x="725" y="95" width="210" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="830" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#15803d">3.23 × 10<tspan dy="-10" font-size="16">6</tspan></text>
  <text x="830" y="168" text-anchor="middle" fill="#15803d">cells / mL</text>
  <text x="725" y="240" fill="#475569">you type the dilution,</text>
  <text x="725" y="260" fill="#475569">then export a report</text>
</svg>
