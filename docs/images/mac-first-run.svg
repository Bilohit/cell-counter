<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <rect width="960" height="400" rx="14" fill="#ffffff"/>

  <!-- A: right-click the file -->
  <text x="30" y="36" font-weight="700" font-size="17" fill="#0f172a">A. Right-click the file, choose Open</text>
  <g transform="translate(30,55)">
    <rect width="290" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="290" height="30" rx="10" fill="#e2e8f0"/>
    <rect y="20" width="290" height="10" fill="#e2e8f0"/>
    <circle cx="16" cy="15" r="5" fill="#f87171"/><circle cx="32" cy="15" r="5" fill="#fbbf24"/><circle cx="48" cy="15" r="5" fill="#4ade80"/>
    <text x="145" y="20" text-anchor="middle" font-size="13" fill="#475569">Cell Counter</text>
    <!-- file icon -->
    <rect x="30" y="60" width="44" height="54" rx="4" fill="#1e293b"/>
    <text x="52" y="93" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0">&gt;_</text>
    <text x="52" y="132" text-anchor="middle" font-size="11" fill="#0f172a">Start Cell</text>
    <text x="52" y="145" text-anchor="middle" font-size="11" fill="#0f172a">Counter.command</text>
    <!-- context menu -->
    <rect x="100" y="80" width="160" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="106" y="88" width="148" height="26" rx="5" fill="#2563eb"/>
    <text x="118" y="106" fill="#ffffff" font-weight="700">Open</text>
    <text x="118" y="136" fill="#334155">Open With</text>
    <text x="118" y="162" fill="#334155">Get Info</text>
    <text x="118" y="188" fill="#334155">Make Alias</text>
    <text x="118" y="214" fill="#334155">…</text>
    <!-- pointer -->
    <path d="M228 98 l0 22 l6 -6 l5 11 l4 -2 l-5 -11 l8 0 z" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- B: confirm Open -->
  <text x="350" y="36" font-weight="700" font-size="17" fill="#0f172a">B. Click Open in the box</text>
  <g transform="translate(350,55)">
    <rect width="260" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="110" y="22" width="40" height="40" rx="8" fill="#1e293b"/>
    <text x="130" y="47" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0">&gt;_</text>
    <text x="130" y="88" text-anchor="middle" font-weight="700" fill="#0f172a">macOS asks if you are sure</text>
    <text x="130" y="110" text-anchor="middle" font-size="13" fill="#475569">"Are you sure you want</text>
    <text x="130" y="127" text-anchor="middle" font-size="13" fill="#475569">to open it?"</text>
    <rect x="20" y="150" width="220" height="30" rx="7" fill="#2563eb"/>
    <text x="130" y="170" text-anchor="middle" fill="#ffffff" font-weight="700">Open</text>
    <rect x="20" y="188" width="220" height="30" rx="7" fill="#e2e8f0"/>
    <text x="130" y="208" text-anchor="middle" fill="#334155">Cancel</text>
  </g>
  <text x="350" y="315" fill="#475569">Only the first time.</text>
  <text x="350" y="335" fill="#475569">After that, just double-click.</text>

  <!-- C: fallback -->
  <text x="640" y="36" font-weight="700" font-size="17" fill="#b45309">C. Only "Done"? Use Settings</text>
  <g transform="translate(640,55)">
    <rect width="290" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="290" height="30" rx="10" fill="#e2e8f0"/>
    <rect y="20" width="290" height="10" fill="#e2e8f0"/>
    <text x="145" y="20" text-anchor="middle" font-size="13" fill="#475569">Privacy &amp; Security</text>
    <text x="16" y="60" font-size="13" fill="#94a3b8">… scroll down …</text>
    <text x="16" y="90" font-weight="700" fill="#0f172a">Security</text>
    <line x1="16" y1="100" x2="274" y2="100" stroke="#e2e8f0"/>
    <text x="16" y="124" font-size="13" fill="#334155">"Start Cell Counter.command"</text>
    <text x="16" y="142" font-size="13" fill="#334155">was blocked to protect your Mac.</text>
    <rect x="150" y="160" width="124" height="30" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="212" y="180" text-anchor="middle" fill="#0f172a" font-weight="700">Open Anyway</text>
  </g>
  <text x="640" y="315" fill="#475569">Apple menu → System Settings</text>
  <text x="640" y="335" fill="#475569">→ Privacy &amp; Security.</text>
  <text x="640" y="355" fill="#475569">Then double-click the file again.</text>

  <text x="30" y="388" font-size="12" fill="#94a3b8">Simplified drawing. The real windows look a little different on each macOS version.</text>
</svg>
