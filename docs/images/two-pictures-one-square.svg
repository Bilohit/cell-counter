<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
  <rect width="900" height="380" rx="14" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0V50H0" fill="none" stroke="#9aa5b1" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Picture 1: first three rows -->
  <text x="40" y="38" font-weight="700" fill="#0f172a">Picture 1</text>
  <text x="40" y="58" fill="#475569">"first three rows"</text>
  <g transform="translate(40,80)">
    <rect width="200" height="150" fill="#eef2f6"/>
    <rect width="200" height="150" fill="url(#grid)"/>
    <rect x="1" y="1" width="198" height="148" fill="none" stroke="#2563eb" stroke-width="4"/>
  </g>
  <text x="40" y="258" fill="#475569">rows 1, 2, 3</text>

  <!-- Picture 2: last three rows -->
  <text x="290" y="38" font-weight="700" fill="#0f172a">Picture 2</text>
  <text x="290" y="58" fill="#475569">"last three rows"</text>
  <g transform="translate(290,80)">
    <rect width="200" height="150" fill="#eef2f6"/>
    <rect width="200" height="150" fill="url(#grid)"/>
    <rect x="1" y="1" width="198" height="148" fill="none" stroke="#ea580c" stroke-width="4"/>
  </g>
  <text x="290" y="258" fill="#475569">rows 2, 3, 4</text>

  <!-- arrow -->
  <line x1="510" y1="155" x2="585" y2="155" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="512" y="138" fill="#334155" font-size="14">joined</text>

  <!-- Whole square -->
  <text x="610" y="38" font-weight="700" fill="#0f172a">One whole square</text>
  <text x="610" y="58" fill="#475569">counted once</text>
  <g transform="translate(610,95)">
    <rect width="200" height="200" fill="#eef2f6"/>
    <rect width="200" height="200" fill="url(#grid)"/>
    <rect x="3" y="3" width="194" height="144" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/>
    <rect x="5" y="53" width="190" height="144" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 5"/>
    <!-- triple boundary line -->
    <rect x="-8" y="-8" width="216" height="216" fill="none" stroke="#16a34a" stroke-width="2"/>
    <rect x="-13" y="-13" width="226" height="226" fill="none" stroke="#16a34a" stroke-width="2"/>
    <rect x="-18" y="-18" width="236" height="236" fill="none" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="610" y="345" fill="#15803d" font-weight="600">Green = the triple line.</text>
  <text x="610" y="365" fill="#15803d">Only cells inside it are counted.</text>

  <text x="40" y="310" fill="#0f172a">At 10x, one picture only fits 3 of the square's 4 rows.</text>
  <text x="40" y="332" fill="#0f172a">So you take two pictures that overlap in the middle.</text>
  <text x="40" y="354" fill="#0f172a">The app lines them up and makes one whole square.</text>
</svg>
